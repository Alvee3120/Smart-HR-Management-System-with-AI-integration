
{% extends "hr/base_hr.html" %}
{% block hr_content %}

<div class="max-w-6xl mx-auto">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Designations</h1>
        <a href="{% url 'employees:designation_create' %}"
           class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold">
            + Add Designation
        </a>
    </div>

    <div class="bg-white rounded-xl shadow border overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-100 text-xs uppercase text-gray-600">
                <tr>
                    <th class="px-4 py-3 text-left">Title</th>
                    <th class="px-4 py-3 text-left">Department</th>
                    <th class="px-4 py-3 text-left">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y">

                {% for d in designations %}
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-3 font-medium">{{ d.title }}</td>
                    <td class="px-4 py-3">{{ d.department.name }}</td>
                    <td class="px-4 py-3">
                        <a href="{% url 'employees:designation_edit' d.id %}"
                           class="text-blue-600 hover:underline">Edit</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="px-4 py-6 text-center text-gray-500">
                        No designations found.
                    </td>
                </tr>
                {% endfor %}

            </tbody>
        </table>
    </div>

</div>

{% endblock %}
