{% extends "hr/base_hr.html" %}

{% block hr_content %}

<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
    
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Apply for Leave</h1>
        <p class="text-sm text-gray-500">Fill in the dates and reason below.</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        {% for field in form %}
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
                {{ field.label }}
            </label>
            
            {{ field }}

            {% if field.errors %}
                <div class="mt-1 text-red-600 text-sm flex items-center animate-pulse">
                    <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                    {{ field.errors.0 }}
                </div>
            {% endif %}
        </div>
        {% endfor %}

        <div class="pt-2">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                Submit Request
            </button>
        </div>
    </form>

</div>

{% endblock %}
