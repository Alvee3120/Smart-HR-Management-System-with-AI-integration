{% extends 'base.html' %}
{% load socialaccount %}

{% block content %}

<div class="flex justify-center mt-16">
    <div class="w-full max-w-md">

        <div class="bg-white shadow-xl rounded-2xl overflow-hidden">

            <!-- Header -->
            <div class="bg-blue-600 text-white text-center py-4">
                <h3 class="text-2xl font-semibold">Login</h3>
            </div>

            <!-- Body -->
            <div class="p-6">

                <!-- Google login -->
                <div class="mb-4 text-center">
                    <a href="{% provider_login_url 'google' %}"
                       class="w-full inline-flex items-center justify-center gap-2 bg-red-600 text-white py-2.5 rounded-lg hover:bg-red-700 transition font-medium">
                        <!-- Google icon (SVG instead of bootstrap icon) -->
                        <svg class="w-5 h-5" viewBox="0 0 48 48">
                            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11.5 0 19.6-8.1 19.6-19.6 0-1.3-.1-2.1-.3-2.9z"/>
                            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/>
                            <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.3l-6.3-5.2C29.3 36 26.8 37 24 37c-5.3 0-9.8-3.4-11.4-8.1l-6.5 5C9.3 39.6 16.1 44 24 44z"/>
                            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3-3.4 5.5-6.3 7.3l.1-.1 6.3 5.2C34.8 39.8 40 35 42 28c.4-1.3.6-2.7.6-4.5z"/>
                        </svg>
                        Continue with Google
                    </a>
                </div>

                <!-- OR divider -->
                <div class="flex items-center my-5">
                    <div class="flex-grow border-t"></div>
                    <span class="mx-3 text-gray-400 text-sm">Or</span>
                    <div class="flex-grow border-t"></div>
                </div>

                <!-- Form -->
                <form method="post" class="space-y-4">
                    {% csrf_token %}

                    {% for field in form %}
                        <div>
                            <label class="block mb-1 text-sm font-medium text-gray-700">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% if field.errors %}
                                <p class="text-sm text-red-600 mt-1">
                                    {{ field.errors.0 }}
                                </p>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button type="submit"
                        class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 transition font-semibold">
                        Login
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <div class="bg-gray-50 text-center py-4 text-sm">
                Don't have an account?
                <a href="{% url 'web_test:register' %}" class="text-blue-600 font-medium hover:underline">
                    Register here
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
