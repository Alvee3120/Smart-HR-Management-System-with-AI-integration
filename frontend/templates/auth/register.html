{% extends 'base.html' %}

{% block content %}

<div class="flex justify-center mt-16">
    <div class="w-full max-w-2xl">

        <div class="bg-white shadow-xl rounded-2xl overflow-hidden">

            <!-- Header -->
            <div class="bg-green-600 text-white text-center py-4">
                <h3 class="text-2xl font-semibold">Create Account</h3>
            </div>

            <!-- Body -->
            <div class="p-6">

                <form method="post" class="space-y-4">
                    {% csrf_token %}

                    {% for field in form %}
                        <div>
                            <label class="block mb-1 text-sm font-medium text-gray-700">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% if field.help_text %}
                                <p class="text-xs text-gray-500 mt-1">
                                    {{ field.help_text }}
                                </p>
                            {% endif %}

                            {% for error in field.errors %}
                                <p class="text-sm text-red-600 mt-1">
                                    {{ error }}
                                </p>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <button type="submit"
                        class="w-full bg-green-600 text-white py-2.5 rounded-lg hover:bg-green-700 transition font-semibold">
                        Sign Up
                    </button>
                </form>

            </div>

            <!-- Footer -->
            <div class="bg-gray-50 text-center py-4 text-sm">
                Already have an account?
                <a href="{% url 'web_test:login' %}" class="text-blue-600 font-medium hover:underline">
                    Login here
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
